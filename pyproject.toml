[project]
name = "sql-table-swiss-knife"
dynamic = ["version"]
description = "Terminal (TUI) app to view and edit rows of catalog/lookup tables without writing SQL — and to show the SQL it runs."
readme = "README.md"
requires-python = ">=3.14"
keywords = ["tui", "sql", "sqlserver", "database", "crud", "catalog"]
dependencies = [
    "textual>=8.2",
    "rich>=15",
    "pyodbc>=5.3.0",
    "keyring>=25",
    "platformdirs>=4",
    "tomli-w>=1.2.0",
]

[project.scripts]
sql-table-swiss-knife = "sql_table_swiss_knife.cli:main"
stsk = "sql_table_swiss_knife.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "ruff>=0.14",
    "mypy>=1.19",
    "pytest-textual-snapshot>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sql_table_swiss_knife/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_table_swiss_knife"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sql_table_swiss_knife"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
mypy_path = "src"
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-config", "--strict-markers"]
filterwarnings = [
    # Upstream: pytest-textual-snapshot still calls datetime.utcnow() when it writes
    # the HTML diff report. Nothing we can fix in this repo.
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning",
]
markers = [
    "live: integration test needing a real SQL Server (tests/live/docker-compose.yml); skipped unless SWISSKNIFE_TEST_DB_URL is set",
]

[tool.coverage.run]
source = ["sql_table_swiss_knife"]
branch = true
